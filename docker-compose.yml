# docker-compose.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proposer
      POSTGRES_PASSWORD: proposer-dev
      POSTGRES_DB: proposer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - proposer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proposer -d proposer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  proposer_pg_data:
