name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Postgres binaries (pg_ctl etc) for pytest-postgresql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Pydantic <-> SQLA alignment check
        run: python scripts/migrations/check_model_alignment.py
      - name: API tests (Postgres-backed)
        env:
          PATH: /usr/lib/postgresql/16/bin:/usr/lib/postgresql/15/bin:/usr/lib/postgresql/14/bin:${{ env.PATH }}
        run: |
          python -m pytest apps/api/tests -q
      - name: Migration scripts tests
        env:
          PATH: /usr/lib/postgresql/16/bin:/usr/lib/postgresql/15/bin:/usr/lib/postgresql/14/bin:${{ env.PATH }}
        run: |
          python -m pytest scripts/migrations/tests -q
