# Development-only LangFuse stack.
#
# WARNING: The secrets/passwords below are development defaults. Do NOT use
# these values in any shared, staging, or production environment. Generate
# strong random values and inject via environment variables instead.
#
# Usage:
#   docker compose -f docker-compose.langfuse.yml up -d
#
# Then browse to http://localhost:3100, create a project, grab the keys, and
# set LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST in .env.

version: "3.9"

services:
  langfuse-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse-dev-password
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  langfuse-web:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      - langfuse-postgres
    ports:
      # Host 3100 -> container 3000 to avoid colliding with Next.js dev on 3000.
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse-dev-password@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: langfuse-dev-nextauth-secret-change-me
      SALT: langfuse-dev-salt-change-me
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_postgres_data:
