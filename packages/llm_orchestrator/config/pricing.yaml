# Per-1M-token pricing for supported LLM models.
#
# This file is the single source of truth for model pricing — the loader at
# ``llm_orchestrator/clients/_pricing.py`` reads it for cost estimation in
# ClientStats. Update ``metadata.checked_at`` whenever prices are refreshed.
#
# Anthropic pricing units: usd_per_1m_tokens for ``input``/``output``.
# OpenAI pricing units: usd_per_1m_tokens, with optional context-tier and
# cached-input variants where applicable. See spec §9 for schema details.

metadata:
  source: "https://developers.openai.com/api/docs/pricing"
  checked_at: "2026-05-01"
  units: "usd_per_1m_tokens"

anthropic:
  claude-sonnet-4-20250514:
    input: 3.0
    output: 15.0
  claude-3-5-sonnet-20241022:
    input: 3.0
    output: 15.0
  claude-3-5-haiku-20241022:
    input: 0.8
    output: 4.0

openai:
  gpt-5.5:
    input_short_context: 2.5
    cached_input_short_context: 0.25
    output_short_context: 15.0
    input_long_context: 5.0
    cached_input_long_context: 0.5
    output_long_context: 22.5
  gpt-5.4:
    input_short_context: 1.25
    cached_input_short_context: 0.13
    output_short_context: 7.5
    input_long_context: 2.5
    cached_input_long_context: 0.25
    output_long_context: 11.25
  gpt-5.4-mini:
    input: 0.375
    cached_input: 0.0375
    output: 2.25
  gpt-5.4-nano:
    input: 0.10
    cached_input: 0.01
    output: 0.625
